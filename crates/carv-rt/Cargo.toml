[package]
name = "carv-rt"
description = "CarvOS user-space runtime: _start, syscall wrappers, growable heap, panic handler and println! (no_std)"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
carv-abi = { path = "../carv-abi" }
# Same allocator core as the kernel heap; default features off (carv-rt brings its own lock).
linked_list_allocator = { version = "0.10.6", default-features = false }
