[package]
name = "chisel"
description = "chisel: the CarvOS microkernel"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "chisel"
# `cargo test -p chisel --target x86_64-unknown-none` builds a bootable test kernel (see src/test.rs).
# Host-side `cargo test --workspace` must pass `--exclude chisel`.
test = true
bench = false

[dependencies]
acpi = { version = "6", default-features = false, features = ["alloc", "aml"] }
carv-abi = { path = "../crates/carv-abi" }
carv-caps = { path = "../crates/carv-caps" }
carv-frames = { path = "../crates/carv-frames" }
limine = "0.6.5"
# Kernel heap core (P1.4); default features off: the kernel wraps it in its own SpinLock.
linked_list_allocator = { version = "0.10.6", default-features = false }
x86_64 = { version = "0.15.5", features = ["abi_x86_interrupt"] }
