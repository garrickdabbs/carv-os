[package]
name = "chisel"
description = "chisel: the CarvOS microkernel"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "chisel"
# `cargo test -p chisel --target x86_64-unknown-none` builds a bootable test kernel (see src/test.rs).
# Host-side `cargo test --workspace` must pass `--exclude chisel`.
test = true
bench = false

[dependencies]
limine = "0.6.5"
