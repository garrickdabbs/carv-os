# cargo-deny policy for CarvOS (docs/PLAN.md §7.3). Run locally with `cargo deny check`.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-none" },
]
all-features = true

[advisories]
# Any advisory of any severity fails the build; fix or explicitly ignore with a reason.
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses only. Anything else needs a deliberate decision, not a silent transitive pull.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
confidence-threshold = 0.9
# The allow-list is a policy, not an inventory: entries no crate uses yet are fine.
unused-allowed-license = "allow"
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path without a version; that is not a wildcard risk.
allow-wildcard-paths = true
highlight = "all"
# The kernel must stay dependency-light; anything pulling in std for the kernel is a bug.
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
