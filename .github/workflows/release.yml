# Release: pushing a `v*` tag builds a reproducible ISO, tests it, and publishes a signed,
# attested GitHub Release. Design: docs/PLAN.md §7.5. No long-lived secrets: signing and
# provenance use the job's OIDC identity.
#
# Two jobs on purpose (least privilege): `build` runs all untrusted-ish work — compilers, QEMU,
# third-party tools — with a read-only token; `publish` only signs, attests and uploads what
# `build` produced.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  build:
    name: build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: install the pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: install QEMU, OVMF, xorriso, zstd
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso zstd
      - name: enable KVM for the runner user
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: release-check (tag ↔ Cargo version ↔ CHANGELOG)
        id: check
        run: cargo xtask release-check --tag "$TAG"

      - name: reproducible build, pass 1
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          cargo xtask image --release
          mkdir -p dist
          cp target/carv-os.iso "dist/carv-os-${TAG}-x86_64.iso"
          cp target/x86_64-unknown-none/release/chisel "dist/chisel-${TAG}.elf"
          sha256sum target/carv-os.iso | cut -d' ' -f1 > /tmp/iso1.sha256
      - name: reproducible build, pass 2 (clean kernel + ISO, must be byte-identical)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          rm -rf target/x86_64-unknown-none target/iso_root target/carv-os.iso
          cargo xtask image --release
          sha256sum target/carv-os.iso | cut -d' ' -f1 > /tmp/iso2.sha256
          echo "pass 1: $(cat /tmp/iso1.sha256)"; echo "pass 2: $(cat /tmp/iso2.sha256)"
          cmp /tmp/iso1.sha256 /tmp/iso2.sha256 || { echo "::error::ISO is not reproducible"; exit 1; }

      - name: full test suite at this commit
        run: cargo xtask test --release --timeout 120
      - name: boot the exact release ISO (UEFI + BIOS)
        run: cargo xtask smoke --release --timeout 120 --iso "dist/carv-os-${TAG}-x86_64.iso"

      - name: install cargo-cyclonedx
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-cyclonedx
      - name: data disk, SBOMs, checksums
        run: |
          set -euo pipefail
          zstd -19 -q -o "dist/carv-os-${TAG}-data.img.zst" target/data.img
          # One CycloneDX document per workspace crate; --describe and --override-filename are
          # mutually exclusive, so rename while copying.
          cargo cyclonedx --format json --describe crate >/dev/null
          find . -name "*.cdx.json" -not -path "./dist/*" | while read -r f; do
            cp "$f" "dist/carv-os-${TAG}-$(basename "$f")"
          done
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: hand the artifacts to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: sign, attest, publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # Sigstore keyless signing + build provenance
      attestations: write
    steps:
      - name: fetch the built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign SHA256SUMS (Sigstore keyless, OIDC)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: build provenance attestation for every artifact
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/carv-os-${{ env.TAG }}-x86_64.iso
            dist/carv-os-${{ env.TAG }}-data.img.zst
            dist/chisel-${{ env.TAG }}.elf
            dist/SHA256SUMS
      - name: publish the provenance as release assets too
        # The attestation lives in GitHub's attestation store; also ship the Sigstore bundle and
        # its DSSE envelope (in-toto statement, one per line) so offline verifiers and OpenSSF
        # Scorecard can find them next to the artifacts.
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "dist/carv-os-${TAG}.provenance.sigstore.json"
          jq -c '.dsseEnvelope' "$BUNDLE" > "dist/carv-os-${TAG}.intoto.jsonl"
          test -s "dist/carv-os-${TAG}.intoto.jsonl"
          ls -l dist

      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          {
            echo "### Verify a download"
            echo '```'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "cosign verify-blob --bundle SHA256SUMS.sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github.com/${REPO}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS"
            echo "gh attestation verify carv-os-${TAG}-x86_64.iso -R ${REPO}"
            echo "# offline: the SLSA provenance is carv-os-${TAG}.intoto.jsonl (DSSE envelope) and carv-os-${TAG}.provenance.sigstore.json"
            echo '```'
            echo "### Boot it"
            echo '```'
            echo "qemu-system-x86_64 -machine q35 -m 512M -cdrom carv-os-${TAG}-x86_64.iso -serial stdio -display none   # BIOS; add OVMF pflash drives for UEFI"
            echo '```'
            echo
          } > notes.md
          case "$PRERELEASE" in
            true) pre="--prerelease" ;;
            false) pre="" ;;
            *) echo "::error::release-check did not report prerelease=true|false (got '$PRERELEASE')"; exit 1 ;;
          esac
          gh release create "$TAG" dist/* --repo "$REPO" --verify-tag --title "CarvOS $TAG" --notes-file notes.md --generate-notes $pre
      - name: verify the published attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "dist/carv-os-${TAG}-x86_64.iso" -R "${{ github.repository }}"
