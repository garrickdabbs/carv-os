# Nightly: the slow and drift-detecting jobs that are too noisy for PRs (docs/PLAN.md §7.4), plus a
# rolling `nightly` pre-release so there is always a bootable image of the latest main.
# Least privilege: everything that runs code uses a read-only token; only `publish` can write.

name: Nightly

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

# A scheduled run and a manual dispatch must never race on the rolling `nightly` release.
concurrency:
  group: nightly-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  nightly:
    name: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install the pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: install QEMU, OVMF, xorriso
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso
      - name: enable KVM for the runner user
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: full test suite (release profile)
        run: cargo xtask test --release --timeout 120
      - name: stress — 10 consecutive boots (UEFI + BIOS each) must all pass
        run: |
          set -euo pipefail
          cargo xtask image --release
          for i in $(seq 1 10); do
            # smoke exits non-zero if *any* scenario fails; never filter its exit code through grep (#28).
            cargo xtask smoke --release --timeout 60 --iso target/carv-os.iso || { echo "::error::boot round $i failed"; exit 1; }
          done
          echo "10/10 rounds passed"
      - name: performance budgets (10-run median)
        run: cargo xtask perf --runs 10

      - name: install cargo-audit
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit
      - name: cargo-audit (fresh RustSec database)
        run: cargo audit --deny warnings

      - name: toolchain drift — does the kernel still build on the newest nightly? (informational)
        continue-on-error: true
        run: |
          rustup toolchain install nightly --profile minimal -c rust-src,clippy -t x86_64-unknown-none
          cargo +nightly build -p chisel --target x86_64-unknown-none --locked
          cargo +nightly clippy -p chisel --target x86_64-unknown-none --locked -- -D warnings
          echo "### toolchain drift: newest nightly ($(rustc +nightly --version)) builds the kernel ✅" >> "$GITHUB_STEP_SUMMARY"

      - name: hand the ISO to the publish job
        run: |
          mkdir -p nightly-dist
          cp target/carv-os.iso nightly-dist/carv-os-nightly-x86_64.iso
          (cd nightly-dist && sha256sum -- * > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-dist
          path: nightly-dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: publish rolling nightly pre-release
    needs: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # move the rolling `nightly` tag/release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-dist
          path: nightly-dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete nightly --repo "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create nightly nightly-dist/* --repo "$REPO" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "nightly (main @ ${GITHUB_SHA::7})" \
            --notes "Rolling, unsigned build of \`main\` at ${GITHUB_SHA} on $(date -u +%Y-%m-%d). Not a release: for tagged, signed, attested images see the versioned releases."

  # PLAN.md §7.4: on failure, create or update one pinned issue with a link to the run; close it
  # with a comment the next time nightly is green. Isolated in its own job with only `issues:
  # write` (no `contents`) so a compromised test dependency can't use this job to touch the repo.
  report-status:
    name: report nightly status
    needs: [nightly, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: "Nightly is failing"
    steps:
      - name: find the pinned "Nightly is failing" issue, if any
        id: find
        run: |
          set -euo pipefail
          number=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: on failure, create or update the pinned issue
        if: needs.nightly.result == 'failure' || needs.publish.result == 'failure'
        run: |
          set -euo pipefail
          if [ -n "${{ steps.find.outputs.number }}" ]; then
            gh issue comment "${{ steps.find.outputs.number }}" --repo "$REPO" \
              --body "Still failing: $RUN_URL"
          else
            number=$(gh issue create --repo "$REPO" --title "$TITLE" \
              --label "kind:bug,area:infra" \
              --body "Nightly failed: $RUN_URL"$'\n\n'"This issue is kept pinned and updated by \`nightly.yml\`'s \`report-status\` job; it is closed automatically the next time nightly is green." \
              --assignee garrickdabbs | awk -F/ '{print $NF}')
            gh issue pin "$number" --repo "$REPO" || echo "::warning::could not pin issue $number (insufficient token scope); it still tracks nightly failures"
          fi
      - name: on success, close the pinned issue if it exists
        if: needs.nightly.result == 'success' && needs.publish.result == 'success' && steps.find.outputs.number != ''
        run: |
          set -euo pipefail
          gh issue comment "${{ steps.find.outputs.number }}" --repo "$REPO" \
            --body "Green again: $RUN_URL"
          gh issue close "${{ steps.find.outputs.number }}" --repo "$REPO" --reason completed
