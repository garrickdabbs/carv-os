# OpenSSF Scorecard: an outside-in audit of this repository's supply-chain practices
# (branch protection, pinned dependencies, token permissions, SAST, …). Publishes to the
# Scorecard API for the README badge and to Security → Code scanning. Public repository → free.

name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 6" # Saturdays 05:23 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload SARIF
      id-token: write # publish_results (signed with OIDC, no long-lived secret)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif
