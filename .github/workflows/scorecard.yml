# OpenSSF Scorecard: an outside-in audit of this repository's supply-chain practices
# (branch protection, pinned dependencies, token permissions, SAST, …). Publishes to the
# Scorecard API for the README badge and to Security → Code scanning. Public repository → free.

name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 6" # Saturdays 05:23 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload SARIF
      id-token: write # publish_results (signed with OIDC, no long-lived secret)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: results.sarif
