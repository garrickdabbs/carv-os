# CodeQL code scanning for Rust sources and for the GitHub Actions workflows themselves.
# Results appear under Security → Code scanning. Public repository → free.

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 3" # Wednesdays 07:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write # upload SARIF results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install the pinned toolchain from rust-toolchain.toml
        if: matrix.language == 'rust'
        run: rustup toolchain install && rustup show active-toolchain
      - name: initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: "/language:${{ matrix.language }}"
