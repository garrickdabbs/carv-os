# CI: the end-to-end gate — `cargo xtask test`: host unit tests, the in-kernel test binary booted
# in QEMU (isa-debug-exit pass/fail code), and real UEFI/BIOS/panic boots with the serial output
# asserted. Design: docs/PLAN.md §7.2. The job keeps its historical name `boot-smoke` because the
# main ruleset requires that check by name.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  boot-smoke:
    name: boot-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install the pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: install QEMU, OVMF, xorriso
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso
      - name: enable KVM for the runner user
        # GitHub's Linux runners expose nested virtualisation; xtask falls back to TCG if this fails.
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true
      - name: cargo xtask test (host + in-kernel + boot smoke)
        run: cargo xtask test --timeout 120
      - name: upload serial logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-serial-logs
          path: |
            target/test/*.log
            target/smoke/*.log
            target/qemu.log
          if-no-files-found: ignore
          retention-days: 14
