# Auto-link PRs to the CarvOS GitHub Project based on task ID in PR body

name: Link PR to Project

on:
  pull_request:
    types: [opened, edited]

permissions:
  contents: read

jobs:
  link:
    name: Link PR to project
    runs-on: ubuntu-latest
    steps:
      - name: Extract task ID from PR body
        id: extract
        run: |
          # Look for "task: P<number>.<number>" pattern in PR body
          TASK=$(echo "${{ github.event.pull_request.body }}" | grep -oP 'task:\s*P\d+\.\d+' | head -1 | cut -d: -f2 | xargs)
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          if [ -z "$TASK" ]; then
            echo "⚠️  No task ID found in PR body (expected format: 'task: P1.2')"
          else
            echo "✅ Found task: $TASK"
          fi

      - name: Add PR to project (if task found)
        if: steps.extract.outputs.task != ''
        run: |
          echo "Would link PR #${{ github.event.pull_request.number }} to project with task: ${{ steps.extract.outputs.task }}"
          # Note: Full project linking requires additional permissions and GitHub Project v2 API
          # This workflow documents the task ID extraction pattern for manual linking
