[alias]
xtask = "run --quiet --package xtask --"

[target.x86_64-unknown-none]
rustflags = [
    # Kernel is linked at a fixed higher-half address (see kernel/linker.ld).
    "-C", "relocation-model=static",
    "-C", "code-model=kernel",
    # Keep frame pointers so panics can walk the stack later.
    "-C", "force-frame-pointers=yes",
    # Remap absolute source paths to relative paths for reproducible builds (#29).
    "-C", "remap-path-prefix=/home/runner/work/carv-os/carv-os=/carv-os",
    "-C", "remap-path-prefix=/root/.cargo=/carv-os/.cargo",
]
