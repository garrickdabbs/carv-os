# `trim-paths` (nightly) keeps checkout/registry/sysroot paths out of release binaries (#29).
cargo-features = ["trim-paths"]

[workspace]
resolver = "3"
members = ["kernel", "xtask", "crates/carv-frames"]
# The kernel only builds for x86_64-unknown-none, so plain `cargo build`/`cargo test`
# at the root skip it. Use `cargo xtask build` to build everything.
default-members = ["xtask", "crates/carv-frames"]

[workspace.package]
version = "0.1.1"
edition = "2024"
repository = "https://github.com/garrickdabbs/carv-os"
license = "MIT"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
# Sanitise every embedded path (workspace → ".", registry deps, rust-src) so the kernel ELF is
# byte-identical on any machine. Symbolising with chisel-vX.Y.Z.elf still works: DWARF line
# info keeps the relative paths.
trim-paths = "all"
