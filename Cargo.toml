[workspace]
resolver = "3"
members = ["kernel", "xtask"]
# The kernel only builds for x86_64-unknown-none, so plain `cargo build`/`cargo test`
# at the root skip it. Use `cargo xtask build` to build everything.
default-members = ["xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
repository = "https://github.com/garrickdabbs/tally"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
